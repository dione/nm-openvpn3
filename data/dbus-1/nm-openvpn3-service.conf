<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the NetworkManager openvpn3 VPN plugin (Rust
  implementation).  Default-deny everywhere except root, which is the
  user NM dispatches the service as via systemd D-Bus activation.

  NetworkManager appends a per-activation suffix to the bus name —
  `org.freedesktop.NetworkManager.openvpn3.Connection_<N>` — so the
  policy must use `own_prefix` (matches name + dotted children), NOT
  `own` (matches the exact string).  The bare `…openvpn3` name itself
  is also covered by `own_prefix`, so a single rule handles both.
-->
<busconfig>
	<policy user="root">
		<allow own_prefix="org.freedesktop.NetworkManager.openvpn3"/>
		<allow send_destination="org.freedesktop.NetworkManager.openvpn3"/>
	</policy>
	<policy context="default">
		<deny own_prefix="org.freedesktop.NetworkManager.openvpn3"/>
		<deny send_destination="org.freedesktop.NetworkManager.openvpn3"/>
	</policy>
</busconfig>
