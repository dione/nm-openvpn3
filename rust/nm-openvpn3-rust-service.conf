<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the Rust port of the NetworkManager openvpn3 VPN
  plugin.  Mirrors nm-openvpn3-service.conf (the C plugin policy) but
  targets the suffixed well-known name claimed by the Rust binary.

  send_destination matches the destination exactly (no prefix wildcard),
  so the C plugin's policy on "org.freedesktop.NetworkManager.openvpn3"
  does NOT cover ".rust" — a dedicated file is required to keep the
  default-deny posture explicit and to leave a clear audit trail.
-->
<busconfig>
	<policy user="root">
		<allow own="org.freedesktop.NetworkManager.openvpn3.rust"/>
		<allow send_destination="org.freedesktop.NetworkManager.openvpn3.rust"/>
	</policy>
	<policy context="default">
		<deny own="org.freedesktop.NetworkManager.openvpn3.rust"/>
		<deny send_destination="org.freedesktop.NetworkManager.openvpn3.rust"/>
	</policy>
</busconfig>
