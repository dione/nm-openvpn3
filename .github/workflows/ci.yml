name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build + make check (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        # Mirrors the dependency set used by the upstream GitLab pipeline
        # so the Fedora-based build matches what GNOME's own CI exercises.
        run: |
          dnf -y install \
            autoconf \
            automake \
            /usr/bin/autopoint \
            gcc \
            gettext-devel \
            glib2-devel \
            gtk3-devel \
            gtk4-devel \
            libnma-devel \
            libnma-gtk4-devel \
            libsecret-devel \
            libtool \
            libxml2 \
            make \
            NetworkManager-libnm-devel \
            pkgconfig \
            findutils \
            file \
            git

      - uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: autoreconf
        run: autoreconf -fis

      - name: configure
        # TODO: 95 pre-existing warnings (mostly ISO C90 mixed-declarations
        # and shadow warnings inherited from upstream).  Switch to
        # --enable-more-warnings=error once those are cleaned up so any new
        # warning aborts the CI build.
        run: |
          ./configure \
            --with-gnome \
            --with-gtk4 \
            --enable-more-warnings=yes \
            --disable-silent-rules

      - name: make
        run: make -j"$(nproc)"

      - name: make check
        run: make check

      - name: Show test logs on failure
        if: failure()
        run: |
          find . -name 'test-suite.log' -print -exec cat {} \;
          find . -name '*.log' -path '*/tests/*' -print -exec cat {} \;

  asan:
    name: Build + tests under AddressSanitizer (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      CFLAGS: "-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g -O1"
      LDFLAGS: "-fsanitize=address -fsanitize=undefined"
      # detect_leaks: report any unfreed allocation at exit.
      # abort_on_error: turn issues into non-zero exit so CI fails loudly.
      # halt_on_error: stop the offending test immediately, do not race forward.
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      # GLib's slice allocator hides leaks from ASan; route everything
      # through plain malloc so leak reports are accurate.
      G_SLICE: "always-malloc"
      G_DEBUG: "gc-friendly"
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install \
            autoconf \
            automake \
            /usr/bin/autopoint \
            gcc \
            gettext-devel \
            glib2-devel \
            gtk3-devel \
            gtk4-devel \
            libasan \
            libubsan \
            libnma-devel \
            libnma-gtk4-devel \
            libsecret-devel \
            libtool \
            libxml2 \
            make \
            NetworkManager-libnm-devel \
            pkgconfig \
            findutils \
            file \
            git

      - uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: autoreconf
        run: autoreconf -fis

      - name: configure (asan)
        run: |
          ./configure \
            --with-gnome \
            --with-gtk4 \
            --disable-silent-rules

      - name: make
        run: make -j"$(nproc)"

      - name: make check (asan)
        run: make check

      - name: Show test logs on failure
        if: failure()
        run: |
          find . -name 'test-suite.log' -print -exec cat {} \;
          find . -name '*.log' -path '*/tests/*' -print -exec cat {} \;
