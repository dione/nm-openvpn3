name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always
  # cargo treats every transient warning as a real diagnostic at -D warnings;
  # explicit RUSTFLAGS keeps the CI signal sharp without burying real errors.
  RUSTFLAGS: "-D warnings"
  # System dev packages every job needs: libnm for the properties crate,
  # gmodule for the editor cdylib loader, libgtk-4 + libadwaita for the
  # editor widgets, gettext for the .po compilation step.
  APT_PACKAGES: >-
    libnm-dev
    libgmodule-2.0-0
    libgtk-4-dev
    libadwaita-1-dev
    gettext

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --release --locked -- -D warnings

  test:
    name: cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        # --locked: fail if Cargo.lock would change, so a dependency
        # bump that wasn't relocked can't slip through CI.
        run: cargo build --release --all-targets --locked
      - name: cargo test --release
        run: cargo test --release --all-targets --locked
      - name: verify expected cdylib symbols
        # The libnm + editor cdylibs must export their factory
        # entrypoints; missing symbols mean NM / nm-applet would dlopen
        # the .so and silently fail.  Cheap sanity check beats a
        # post-merge regression in gnome-control-center.
        run: |
          test -f target/release/libnm_vpn_plugin_openvpn3.so
          test -f target/release/libnm_vpn_plugin_openvpn3_editor.so
          nm -D target/release/libnm_vpn_plugin_openvpn3.so \
              | grep -q ' T nm_vpn_editor_plugin_factory$'
          nm -D target/release/libnm_vpn_plugin_openvpn3_editor.so \
              | grep -q ' T nm_vpn_editor_factory_openvpn3$'

  po:
    name: validate translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: msgfmt -c on every catalog
        run: |
          fail=0
          for po in po/*.po; do
            [ -e "$po" ] || continue
            if ! msgfmt -c -v "$po" -o /dev/null; then
              echo "::error file=$po::msgfmt rejected this catalog"
              fail=1
            fi
          done
          exit $fail
      # POT-vs-source drift detection is intentionally not automated:
      # `tr(…)` calls in the editor crate frequently span multiple
      # source lines, which makes regex extraction unreliable.  POT
      # maintenance lives in po/README.md as a manual checklist.
